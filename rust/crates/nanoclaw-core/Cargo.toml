[package]
name = "nanoclaw-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
cron = "0.15"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
