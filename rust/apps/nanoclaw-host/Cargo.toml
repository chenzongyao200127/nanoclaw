[package]
name = "nanoclaw-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nanoclaw-host"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
nanoclaw-core = { path = "../../crates/nanoclaw-core" }
nanoclaw-db = { path = "../../crates/nanoclaw-db" }
nanoclaw-runtime = { path = "../../crates/nanoclaw-runtime" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
