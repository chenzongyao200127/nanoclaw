[package]
name = "nanoclaw-setup"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nanoclaw-setup"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
nanoclaw-core = { path = "../../crates/nanoclaw-core" }
nanoclaw-db = { path = "../../crates/nanoclaw-db" }
serde_json = "1"
